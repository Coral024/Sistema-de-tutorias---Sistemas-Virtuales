services:
  db:
    image: postgres:15
    container_name: tutorias_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tutorias
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./baseDatos.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./backend
    container_name: tutorias_api
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: tutorias_web
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html

volumes:
  db_data: